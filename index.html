<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Location Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-lg w-full text-center">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">📍 IP Tracker</h1>
        <p class="text-gray-500 mb-6">Cari tahu informasi lokasi dari alamat IP mana pun</p>

        <div class="flex gap-2 mb-6">
            <input type="text" id="ipInput" placeholder="Masukkan Alamat IP (contoh: 8.8.8.8)" 
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="lookupIP()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition">
                Cari
            </button>
        </div>

        <div id="loading" class="hidden text-gray-600 font-medium animate-pulse mb-4">Mencari data...</div>
        <div id="error" class="hidden text-red-500 font-medium mb-4"></div>

        <div id="result" class="hidden text-left border-t pt-6 space-y-3">
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">IP Address:</span> <span id="resIP" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">Negara:</span> <span id="resCountry" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">Kota:</span> <span id="resCity" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between border-b pb-2"><span class="font-semibold text-gray-600">ISP / Provider:</span> <span id="resISP" class="text-gray-900 font-medium"></span></div>
            <div class="flex justify-between"><span class="font-semibold text-gray-600">Koordinat:</span> <span id="resCoords" class="text-gray-900 font-medium"></span></div>
        </div>
    </div>

    <script>
        // Fungsi mendeteksi IP pengguna saat pertama kali buka web
        window.onload = () => {
            lookupIP(''); // Panggil tanpa argumen untuk cek IP sendiri
        };

        async function lookupIP(inputIp) {
            const ip = inputIp !== undefined ? inputIp : document.getElementById('ipInput').value.trim();
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            // Reset tampilan
            loading.classList.remove('hidden');
            error.classList.add('hidden');
            result.classList.add('hidden');

            try {
                // Menggunakan API gratis dari ip-api.com
                const response = await fetch(`http://ip-api.com/json/${ip}`);
                const data = await response.json();

                if (data.status === "fail") {
                    throw new Error(data.message || "IP tidak valid atau tidak ditemukan.");
                }

                // Masukkan data ke HTML
                document.getElementById('resIP').innerText = data.query;
                document.getElementById('resCountry').innerText = `${data.country} (${data.countryCode})`;
                document.getElementById('resCity').innerText = data.city;
                document.getElementById('resISP').innerText = data.isp;
                document.getElementById('resCoords').innerText = `${data.lat}, ${data.lon}`;

                // Tampilkan hasil
                result.classList.remove('hidden');
            } catch (err) {
                error.innerText = `Error: ${err.message}`;
                error.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
